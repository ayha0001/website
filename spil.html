<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game</title>
    <link rel="stylesheet" href="css/spil.css" />
    <link rel="stylesheet" href="css/header.css" />
  </head>
  <body>
    <header>
      <nav>
        <ul class="menu">
          <li><a href="index.html">Home</a></li>
          <li><a href="spil.html">Game</a></li>
          <li><a href="grafik.html">Graphics</a></li>
          <li><a href="assets.html">Assets</a></li>
          <li><a href="teknik.html">Technique</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <div id="screen">
        <div id="game">
          <div id="game_background"></div>

          <div id="game_elements">
            <div id="worm_container">
              <div id="worm_sprite"></div>
            </div>
            <div id="spider_container">
              <div id="spider_sprite"></div>
            </div>
            <div id="poison_container">
              <div id="poison_sprite"></div>
            </div>
            <div id="espresso_container">
              <div id="espresso_sprite"></div>
            </div>
            <div id="vodka_container">
              <div id="vodka_sprite"></div>
            </div>
            <div id="kahlua_container">
              <div id="kahlua_sprite"></div>
            </div>
            <div id="icecube_container">
              <div id="icecube_sprite"></div>
            </div>
            <div id="coffeebean_container">
              <div id="coffeebean_sprite"></div>
            </div>
          </div>
          <div id="game_foreground"></div>
          <div id="game_ui">
            <div id="time_container">
              <div id="time_sprite"></div>
            </div>
            <div id="score_board">
              <div id="point"></div>
              <div id="score">Points:</div>
            </div>
            <div id="life_board">
              <div id="heart"></div>
              <div id="lives"></div>
            </div>
          </div>
          <div id="start"></div>
          <div id="game_over">
            <a href="spil.html" class="playgameover"></a>
          </div>
          <div id="level_complete">
            <a href="spil.html" class="playcomplete"></a>
          </div>
        </div>
      </div>
      <div id="sounds">
        <audio src="lyde/yay.mp3" id="yay_sound"></audio>
        <audio src="lyde/ew.mp3" id="ew_sound"></audio>
        <audio src="lyde/baggrundsmusik.mp3" id="backgroundmusic"></audio>
      </div>
    </main>
    <script src="js/spil.js"></script>
  </body>
</html>
